<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<section class="form-page">
    <div class="form-card">
        <h1>Edit Task</h1>
        <p class="form-subtitle">Update your planner beautifully.</p>

        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('edit_task', task_id=task.id) }}" class="task-form js-reminder-form">
            <div class="mb-4">
                <label for="title">Task Title</label>
                <input
                    type="text"
                    id="title"
                    name="title"
                    value="{{ task.title or '' }}"
                    class="form-control custom-input"
                    required
                >
            </div>

            <div class="mb-4">
                <label for="due_date">Due Date</label>
                <input
                    type="date"
                    id="due_date"
                    name="due_date"
                    value="{{ task.due_date or '' }}"
                    class="form-control custom-input"
                >
            </div>

            <div class="mb-4">
                <label for="due_time">Due Time</label>
                <input
                    type="time"
                    id="due_time"
                    name="due_time"
                    value="{{ task.due_time or '' }}"
                    class="form-control custom-input"
                >
            </div>

            <div class="mb-4">
                <label for="priority">Priority</label>
                <select id="priority" name="priority" class="form-select custom-input">
                    <option value="Low" {% if task.priority == 'Low' %}selected{% endif %}>Low</option>
                    <option value="Medium" {% if task.priority == 'Medium' %}selected{% endif %}>Medium</option>
                    <option value="High" {% if task.priority == 'High' %}selected{% endif %}>High</option>
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="main-btn">Update Task</button>
                <a href="{{ url_for('index') }}" class="back-btn">Back Home</a>
            </div>
        </form>
    </div>
</section>

<script src="{{ url_for('static', filename='reminders.js') }}"></script>
</body>
</html>
